version: '3.8'

services:
  web:
    # On utilise l'image hébergée sur Docker Hub, téléchargée sur le VPS
    image: laurentmd5/sse-suivi-ftth:${IMAGE_TAG:-latest}
    container_name: suivi_ftth_web
    restart: always
    environment:
      - FLASK_ENV=production
      # La clé secrète doit être configurée dans un fichier .env sur le VPS
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=mysql+pymysql://suivi_user:suivi_password@db/suivi_ftth
    depends_on:
      - db
    volumes:
      - uploads_volume:/app/uploads
    # Plus de section 'ports', seul nginx expose les ports vers l'extérieur

  db:
    image: mysql:8.0
    container_name: suivi_ftth_db
    restart: always
    environment:
      # Les identifiants MySQL doivent aussi être sécurisés en production
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=suivi_ftth
      - MYSQL_USER=suivi_user
      - MYSQL_PASSWORD=suivi_password
    volumes:
      - db_volume:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: suivi_ftth_nginx
    restart: always
    ports:
      - "80:80"
      # Dé-commenter la ligne suivante une fois les certificats SSL/TLS générés
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web

  # Service certbot (Commenté par défaut, à lancer une fois pour générer le certificat)
  # certbot:
  #   image: certbot/certbot
  #   container_name: suivi_ftth_certbot
  #   volumes:
  #     - certbot_www:/var/www/certbot
  #     - certbot_conf:/etc/letsencrypt

volumes:
  db_volume:
  uploads_volume:
  certbot_www:
  certbot_conf:
