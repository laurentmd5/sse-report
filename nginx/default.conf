server {
    listen 80;
    server_name tech.sse.sn;

    # Emplacement pour le challenge Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP vers HTTPS (à décommenter après avoir généré le certificat SSL)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Configuration temporaire HTTP (à remplacer par HTTPS par la suite)
    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pour autoriser l'upload de gros fichiers (ex: PDF)
        client_max_body_size 50M;
    }
}

